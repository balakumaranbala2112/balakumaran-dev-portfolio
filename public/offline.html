<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — Balakumaran K</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #09090b;
      --bg-card:     #18181b;
      --surface:     #1e293b;
      --border:      #27272a;
      --primary:     #2563eb;
      --primary-glow: rgba(37, 99, 235, 0.22);
      --primary-soft: rgba(37, 99, 235, 0.1);
      --text:        #f8fafc;
      --muted:       #94a3b8;
      --accent-blue: #60a5fa;
      --green:       #10b981;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* ── Background glow blobs ── */
    body::before {
      content: '';
      position: fixed;
      top: -15%;
      left: -10%;
      width: 55vw;
      height: 55vw;
      max-width: 560px;
      max-height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -15%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      max-width: 500px;
      max-height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── dot grid ── */
    .bg-dots {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(96, 165, 250, 0.09) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 75%);
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 1;
      max-width: 440px;
      width: 100%;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 0 40px var(--primary-glow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* ── Icon area ── */
    .icon-wrap {
      width: 80px;
      height: 80px;
      background: var(--primary-soft);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 30px var(--primary-glow);
      animation: iconPulse 3s ease-in-out infinite;
    }

    .icon-wrap svg {
      width: 40px;
      height: 40px;
      color: var(--accent-blue);
      stroke-width: 1.5;
    }

    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 0 30px var(--primary-glow); }
      50% { box-shadow: 0 0 50px rgba(37, 99, 235, 0.35); }
    }

    /* ── Status badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f87171;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Heading ── */
    h1 {
      font-size: clamp(1.6rem, 5.5vw, 2.1rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.65rem;
      background: linear-gradient(135deg, #f1f5f9 30%, var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Description ── */
    p.desc {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }

    /* ── Info card ── */
    .info-box {
      background: rgba(37, 99, 235, 0.06);
      border: 1px solid rgba(37, 99, 235, 0.2);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 1.75rem;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .info-box svg {
      color: var(--accent-blue);
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .info-box p {
      font-size: 0.875rem;
      color: #93c5fd;
      line-height: 1.5;
      margin: 0;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.78rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.22s ease;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.5);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--accent-blue);
      border-color: rgba(96, 165, 250, 0.35);
      transform: translateY(-2px);
    }

    /* ── Footer brand ── */
    .brand {
      position: relative;
      z-index: 1;
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.55);
      letter-spacing: 0.04em;
    }

    .brand strong {
      color: var(--accent-blue);
      font-weight: 700;
    }

    /* ── Pulse dots ── */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border);
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { background: var(--border); transform: scale(1); }
      50% { background: var(--primary); transform: scale(1.5); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.35rem;
        border-radius: 18px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-dots"></div>

  <div class="card">
    <!-- Icon -->
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
      </svg>
    </div>

    <!-- Status badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      No Connection
    </div>

    <!-- Heading -->
    <h1>You're Offline</h1>

    <!-- Description -->
    <p class="desc">Looks like your internet connection dropped. Check your network and try again — previously visited pages are still accessible.</p>

    <!-- Info box -->
    <div class="info-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
      </svg>
      <p>💡 Tip: Previously visited pages are cached and still accessible while offline.</p>
    </div>

    <!-- Action buttons -->
    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Try Again
      </button>
      <a href="/" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Go to Homepage
      </a>
    </div>

    <!-- Pulse dots -->
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- Brand footer -->
  <p class="brand">
    <strong>Balakumaran K</strong> · Full-Stack MERN Developer
  </p>

</body>
</html>
